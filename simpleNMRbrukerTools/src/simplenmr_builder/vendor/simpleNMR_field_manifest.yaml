# simpleNMR Field-Contract Manifest — DRAFT
#
# Single source of truth for the JSON contract shared by Bruker, JEOL/JASON,
# and MNova client converters submitting to simpleNMRtools' /simpleMNOVA
# endpoint. MNova's output is the reference standard.
#
# STATUS: draft, fourth pass. Built from:
#   - project summary conversation (real matched sample files, all 3 sources)
#   - full reading of core/html_from_assignments.py, app/routes.py,
#     app/pipelines/sync_pipeline.py, app/pipelines/prediction_pipeline.py
#   - full reading of core/nmrsolution.py (3310 lines) and core/expectedmolecule.py
#     (722 lines), second session (2026-08-25)
#   - full reading of config/globals.py and config/excel_headers.py, cloned
#     directly from github.com/EricHughesABC/simpleNMRtools, third session
#     (2026-08-25)
#   - cloned and read the live (non-development, non-archive) client converters
#     from github.com/EricHughesABC/simpleNMRbrukerTools (core/json_converter.py,
#     topspin_programs/simpleNMRbruker.py) and
#     github.com/EricHughesABC/simpleNMRjeolTools3 (simpleNMRjeolTools.py,
#     chooseSpectra.py), fourth session (2026-08-25)
#   - cross-checked against a real submitted MNova JSON file
#     (Cytochalasin-B-kate_assignments_mresnova.json, provided directly),
#     fifth session (2026-08-25)
# NOT YET DONE: config.py, models/*.py, extensions.py, init.py, run.py in
#   simpleNMRtools. The Bruker/JEOL repos' own development/ and archive/
#   subfolders were deliberately skipped in favor of their live entry points —
#   flag if something in those older files turns out to still matter.
#
# COLUMN-HEADER CONSOLIDATION CONTEXT (per Eric, 2026-08-25): the pandas column
# header constants used throughout simpleNMRtools have a real history behind why
# they're scattered rather than centralized. They originate from the MNova table
# headers that were originally copied into an Excel sheet, which the first-
# generation simpleNMR program read directly. The current pipeline reads JSON,
# builds pandas dataframes, and transforms column headers to a common uniform
# set (standardize_column_headings() / NMREXPERIMENTS_COLUMN_RENAME_MAP,
# confirmed in core/html_from_assignments.py) — but the constants defining that
# uniform set are NOT yet consolidated: config/excel_headers.py holds some
# (EXCEL_ORIG_DF_COLUMNS), config/globals.py holds others (the "g." namespace
# used pervasively for column names like g.PPM, g.ATOMNUMBER, g.INTENSITY,
# etc.), and there are likely more definitions scattered elsewhere still unread.
# Eric's stated eventual goal: consolidate ALL of these into config/globals.py
# as the single source of truth. This manifest's own goal (a common JSON input
# contract) and Eric's column-header consolidation goal are complementary but
# distinct — the manifest documents the JSON *input* contract; the g.* constants
# are the *internal* pandas representation the JSON gets transformed into. Worth
# keeping in view for the eventual common-interface design, since a clean input
# schema should probably map cleanly onto whatever the consolidated g.* constants
# turn out to be, once that consolidation happens.
#
# category values:
#   spectrum_block   - lives under a classified top-level key (HSQC_0, COSY_0, ...)
#   indexed_dict      - top-level key with a dict-of-records "data" substructure
#                       (parsed via DataFrame.from_dict(data,orient="index"))
#   singleton_scalar  - top-level key with a single-value "data" substructure
#                       (parsed via DataFrame(data, index=[0]))
#   special           - has bespoke parsing logic, documented in notes

fields:

  # ---------------------------------------------------------------------
  # Spectrum classification
  # ---------------------------------------------------------------------
  _spectrum_key_classification:
    category: special
    note: >
      Top-level keys are split on "_"; if the split has 2 parts the
      classification token is part[0], if 3 parts it's part[0]+"_"+part[1],
      if 4 parts it's part[0]+"_"+part[1]+"_"+part[2], else part[0].
      The resulting token is checked against config/globals.py:NMREXPERIMENTS.
      If matched, the block is parsed as 1D or 2D based on its own "type"
      field ("1D"/"2D"), NOT by key name. pulsesequence/subtype/
      experimenttype are read but never used for this classification.
      Dict key stored at this stage is the FULL original key (e.g. "HSQC_0"),
      not yet collapsed to the classification token.
      RESOLVED this pass — NMREXPERIMENTS token list confirmed by directly
      reading config/globals.py (10 tokens): H1_1D, C13_1D, DEPT135, HSQC,
      HMBC, COSY, NOESY, H1_pureshift, HSQC_CLIPCOSY, DDEPTCH3ONLY. All 10
      classify and parse into dataframes; only 9 of the 10 are actually
      consumed downstream (NOESY is the exception — see its own entry).
      NOT yet verified: whether the splitting rule has edge cases with
      fewer than 2 or more than 4 parts.
    column_rename_map_confirmed: >
      CONFIRMED this pass, config/globals.py:NMREXPERIMENTS_COLUMN_RENAME_MAP,
      applied via standardize_column_headings(). Raw MNova-table-derived
      column names get renamed to the standardized set: "H's"->numProtons,
      "Integral"->integral, "J's"->jCouplingVals, "Class"->jCouplingClass,
      "Intensity"->intensity, "Shift"->ppm, "Range"->range,
      "f2 (ppm)"->f2_ppm, "f1 (ppm)"->f1_ppm, "Type"->signaltype. This is
      the literal raw->standardized column mapping any converter (Bruker/
      JEOL) targeting the standardized dataframe shape should replicate,
      OR any common-interface JSON schema could simply require the
      already-standardized names and skip this rename step entirely.
    excel_headers_confirmed: >
      CONFIRMED this pass by directly reading config/excel_headers.py.
      Two dicts exist: EXCEL_ORIG_DF_COLUMNS (raw/pre-rename columns per
      experiment type, actively imported and used by
      NMRProblem.add_missing_spectra) and EXCEL_DF_COLUMNS (post-rename
      columns per experiment type) — but EXCEL_DF_COLUMNS is DEAD CODE,
      confirmed by repo-wide grep: it is defined but never imported or
      referenced anywhere outside its own definition. Don't treat it as
      authoritative; EXCEL_ORIG_DF_COLUMNS is the one that actually drives
      behavior. Also note EXCEL_DF_COLUMNS uses inconsistent/different key
      names (lowercase "h1"/"c13"/"cosy"/"hsqc" etc.) that don't even match
      the NMREXPERIMENTS tokens or EXCEL_ORIG_DF_COLUMNS's own keys — one
      more reason to disregard it as a stale artifact, not a second source
      of truth.
      EXCEL_ORIG_DF_COLUMNS's per-type raw columns, confirmed: H1_1D =
      [Name, Shift, Range, H's, Integral, Class, J's, Method] (unique
      shape, distinct from the other 1D types); C13_1D/DEPT135/
      H1_pureshift share [ppm, Intensity, Width, Area, Type, Flags,
      Impurity/Compound, Annotation]; COSY/HSQC/HSQC_CLIPCOSY/
      DDEPTCH3ONLY/HMBC/NOESY (all 2D types) share [f2 (ppm), f1 (ppm),
      Intensity, Width f2, Width f1, Volume, Type, Flags,
      Impurity/Compound, Annotation]. nmrAssignments and c13predictions
      columns here match what was independently confirmed by code-reading
      last pass — good cross-confirmation, no discrepancy.
    coverage_gap_confirmed: >
      IMPORTANT ROBUSTNESS FINDING this pass: EXCEL_ORIG_DF_COLUMNS's keys
      are exactly {nmrAssignments, c13predictions, molecule, H1_1D, C13_1D,
      DEPT135, H1_pureshift, COSY, HSQC, HSQC_CLIPCOSY, DDEPTCH3ONLY, HMBC,
      NOESY} — 13 keys. NMRProblem.add_missing_spectra()'s exceptions_names
      list is {molfile, carbonAtomsInfo, nmrAssignments, c13predictions,
      molecule}, but "molfile" and "carbonAtomsInfo" are NOT among
      EXCEL_ORIG_DF_COLUMNS's keys. Since add_missing_spectra only
      iterates excel_orig_df_columns.keys(), molfile and carbonAtomsInfo
      are NEVER backfilled if missing from a submission — unlike
      nmrAssignments/c13predictions/molecule, which do get an empty
      placeholder dataframe. Combined with nmrsolution.py's direct,
      un-guarded dict access (self.dataframes["molfile"], .loc[0,...] on
      the same line, similarly for "smiles" and "carbonAtomsInfo"), a
      submission genuinely missing molfile, smiles, or carbonAtomsInfo
      would raise an uncaught KeyError deep in NMRsolution.__init__
      rather than failing gracefully via the self.fail()/error-message
      pattern used everywhere else (HSQC missing, DEPT135 missing, etc.).
      PRACTICAL IMPLICATION for the common-interface work: molfile,
      smiles, and carbonAtomsInfo are the fields most worth validating
      for presence at the interface/converter layer itself, before
      submission, since the server has no graceful fallback for them.
    add_missing_spectra_note: >
      NMRProblem.add_missing_spectra() (called before classification-
      collapse) back-fills any experiment key from EXCEL_ORIG_DF_COLUMNS
      that isn't present in the submitted JSON, inserting an EMPTY
      dataframe under "<key>_0" with the expected columns. The three
      genuine singleton/indexed exceptions that get backfilled directly
      under their own key are nmrAssignments, c13predictions, and
      "molecule" (see coverage_gap_confirmed above for what's NOT
      covered). The "molecule" key itself (columns: molecule, smiles) is
      CONFIRMED real — it's a genuine EXCEL_ORIG_DF_COLUMNS entry, not
      vestigial as guessed last pass — but it's still functionally inert:
      nothing outside add_missing_spectra ever reads dataframes["molecule"].
      PRACTICAL IMPLICATION: no NMREXPERIMENTS spectrum-type block is a
      hard submission requirement at the parsing level — missing ones are
      silently backfilled empty. The only spectrum-level hard requirement
      is enforced later and only for HSQC (see HSQC entry below).
    real_file_confirmation_SKIP_block_key: >
      CONFIRMED this pass from a real submitted file (provided directly,
      Cytochalasin-B-kate_assignments_mresnova.json): when a user marks a
      spectrum's dropdown as "SKIP" in MNova's dialog, the spectrum's own
      top-level JSON block key gets tagged "SKIP_0" (i.e. MNova uses the
      dropdown-selected value, including the literal string "SKIP", as
      the block's classification prefix — not the spectrum's true
      instrument-derived experiment type). Since "SKIP" is not a member
      of NMREXPERIMENTS, this block can never classify or parse into a
      dataframe regardless of what happens to the chosenSpectra string
      parsing. This is a genuine second, independent SKIP-enforcement
      mechanism at the JSON-structure level, on top of the chosenSpectra-
      string-level SKIP that core/nmrsolution.py explicitly strips —
      belt-and-braces, not redundant duplication of the same code path.
      Real example confirmed: chosenSpectra entry
      "13C 1D zgzrse Cytochalasin_B_(CB).3.fid_1 SKIP" corresponds to a
      top-level block literally keyed "SKIP_0" in the same file, whose
      internal fields (pulsesequence: "zgzrse", nucleus: "13C", etc.)
      confirm it's the same spectrum, just relabeled at the key level.
    real_file_confirmation_orphan_blocks: >
      CONFIRMED this pass from the same real file: not every top-level
      spectrum-shaped block (datatype: "nmrspectrum", with peaks/
      multiplets/integrals substructure) follows a clean
      "<NMREXPERIMENTS_token>_<N>" key pattern. Two real examples found:
      "Cytochalasin_B_(CB).2.fid_0" (a genuine, fully-formed 1H 1D
      spectrum block, structurally identical in shape to the classified
      blocks, but never referenced by chosenSpectra/exptIdentifiers at
      all — appears to be a leftover/unselected raw spectrum MNova
      includes regardless) and "Predicted_13C_NMR_Spectrum_6" (a
      predicted-13C spectrum block, distinct from the separate
      c13predictions top-level field). Both keys fail classification
      under the "_spectrum_key_classification" splitting rule purely
      because the underlying MNova experiment title/filename happens to
      contain multiple underscores itself — the rule wasn't designed
      with compound names or spectrum titles containing "_" in mind, and
      silently falls through to the generic "Skipping dataset" debug-log
      path rather than misclassifying. PRACTICAL IMPLICATION: this is
      confirmed HARMLESS current behavior (such blocks are simply and
      correctly ignored), but worth documenting explicitly for anyone
      building a schema validator or diff tool against real submissions
      — full-file JSON diffs will show these "extra" unclassified blocks
      routinely and should not treat them as errors or as evidence of a
      malformed submission.
    confirmed_downstream_consumption: >
      CONFIRMED (core/html_from_assignments.py combine_multiple_
      nmrExpt_dataframes + NMRProblem.__init__, core/nmrsolution.py
      NMRsolution.__init__): after classification, a SECOND pass
      (combine_multiple_nmrExpt_dataframes) re-splits each key with
      k.rsplit("_", 1) and, if the prefix is in NMREXPERIMENTS, collapses
      all same-prefix blocks (e.g. "HSQC_0", "HSQC_1") into one dataframe
      keyed by the bare token ("HSQC") — concatenated, de-duplicated on
      ppm (1D) or f1_ppm+f2_ppm (2D), sorted descending. This is why
      downstream code (NMRsolution.__init__) can safely do
      problemdata_json.dataframes["HSQC"] etc. rather than "HSQC_0".
      Of the 10 NMREXPERIMENTS tokens, 9 are actually READ downstream:
      HSQC, HMBC, COSY, DEPT135, DDEPTCH3ONLY, HSQC_CLIPCOSY, H1_1D,
      H1_pureshift, C13_1D. NOESY is the sole exception — see its entry.
    multi_block_real_world_purpose: >
      CONFIRMED by Eric directly, and CLARIFIED further: multiple
      same-type blocks are a genuine, intentional user workflow for ANY
      of the 10 NMREXPERIMENTS types — not specific to HMBC/HSQC (an
      earlier version of this note used those two as illustrative
      examples, which risked implying a narrower scope than is actually
      true; corrected here). A user can submit COSY_0+COSY_1,
      DEPT135_0+DEPT135_1, H1_1D_0+H1_1D_1, etc. — any experiment type
      collected under different acquisition regimes (e.g. to improve
      indirect-dimension resolution) — and the server is expected to
      combine them into one dataframe for that type. This matches the
      code, which was never type-specific: combine_multiple_
      nmrExpt_dataframes operates generically on whatever k1 is in
      NMREXPERIMENTS, with no special-casing anywhere. Any converter or
      common-interface schema should treat "more than one block per
      experiment type" as a first-class, supported case for EVERY
      spectrum-block field in this manifest, not just the 2D correlation
      experiments.
    caution_exact_match_dedup: >
      OBSERVATION worth raising with Eric, prompted by his multi-block
      explanation: the actual de-duplication in
      combine_multiple_nmrExpt_dataframes is EXACT floating-point value
      matching (pandas drop_duplicates(subset=["ppm"]) for 1D types or
      subset=["f1_ppm","f2_ppm"] for 2D types) — there's no tolerance
      window applied, unlike the CARBONSEPARATION/PROTONSEPARATION-based
      near-match tolerance logic used elsewhere in the codebase for
      comparable peak-matching problems. This applies uniformly to
      whichever experiment type has multiple blocks — 1D types (H1_1D,
      C13_1D, DEPT135, H1_pureshift) dedup on "ppm", 2D types (HSQC,
      HMBC, COSY, HSQC_CLIPCOSY, DDEPTCH3ONLY, NOESY) dedup on
      "f1_ppm"+"f2_ppm", but the exact-match mechanism and its limitation
      are identical across all of them. Given that the whole point of
      collecting two datasets under different regimes is to get
      different resolution/referencing on what should be the SAME
      underlying peak/correlation, that peak's ppm value is very
      unlikely to be bit-for-bit identical across the two acquisitions —
      so in practice this step likely behaves as a union of both peak
      lists (genuinely new peaks kept, near-duplicate-but-not-identical
      peaks ALSO kept as separate rows) rather than a true reconciliation
      of the same peak/correlation seen twice, for ANY experiment type
      submitted with multiple blocks. This may be exactly the intended
      behavior (a richer combined peak list is often desirable) or it
      may be an oversight relative to the stated goal — worth a direct
      question to Eric rather than assuming either way, since it affects
      real peak counts downstream (e.g. CH2/CH1/CH3 count-matching logic
      in nmrsolution.py that compares peak counts against expected atom
      counts could be affected by inflated near-duplicate rows, for any
      of the affected experiment types, not just HMBC/HSQC).

  # ---------------------------------------------------------------------
  # Spectrum-block fields (category: spectrum_block)
  # NEWLY ADDED this pass — these were referenced in _spectrum_key_
  # classification but never individually documented. Requiredness
  # confirmed by reading core/nmrsolution.py's NMRsolution.__init__ and
  # its downstream fail() calls directly, not inferred.
  # ---------------------------------------------------------------------
  HSQC:
    category: spectrum_block
    required: hard   # CONFIRMED core/nmrsolution.py L61-68, L84-86; CONFIRMED directly by Eric this pass
    server_consumed: true
    note: >
      The one unconditionally hard-required spectrum — CONFIRMED both by
      code (two independent checks) and directly by Eric this pass ("HSQC
      is the only necessary data file. If we do not have HSQC data the
      program will not work"). Checks: (1) "HSQC" must be present in
      chosenSpectra's expt set after SKIP is stripped, else fails "HSQC
      experiment not present"; (2) the resulting HSQC dataframe must be
      non-empty, else fails "HSQC experiment contains no data". Everything
      else in NMRsolution is built on top of HSQC. This should be treated
      as settled for the common-interface schema — every other spectrum
      type is genuinely optional at the contract level.

  DEPT135:
    category: spectrum_block
    required: conditional
    server_consumed: true
    condition: >
      CONFIRMED core/nmrsolution.py check_hsqc_assign_CH2_from_DEPT135()
      (L733-777). Only required when the molecule has CH2 carbons AND the
      HSQC data does NOT already encode CH2 via negative intensity AND the
      count of positive-intensity HSQC peaks exceeds CH1+CH3 count (i.e.
      genuine CH2 ambiguity exists). If HSQC already carries multiplicity
      editing (negative intensities present), DEPT135 is not needed even
      when the molecule has CH2 carbons. When it IS needed and missing/
      empty/mismatched in count, fails with one of three distinct DEPT-
      related error messages.

  COSY:
    category: spectrum_block
    required: unknown
    server_consumed: true
    note: Read into self.cosy_df and used throughout assignment logic;
      not yet traced whether an empty COSY causes a hard failure or a
      degraded-but-successful solve.

  HMBC:
    category: spectrum_block
    required: unknown
    server_consumed: true
    note: Same status as COSY — consumed extensively, hard-requirement
      status not yet confirmed.

  HSQC_CLIPCOSY:
    category: spectrum_block
    required: unknown
    server_consumed: true

  DDEPTCH3ONLY:
    category: spectrum_block
    required: unknown
    server_consumed: true

  H1_1D:
    category: spectrum_block
    required: unknown
    server_consumed: true
    note: >
      CONFIRMED not the sole source of proton shifts — H1 and pureshift
      dataframes are primarily REBUILT from HSQC f2_ppm values
      (init_h1_and_pureshift_from_c13_hsqc_hmbc_cosy), with any submitted
      H1_1D data used only to merge in J-coupling values by nearest-ppm
      match. Submitting H1_1D may therefore be optional for a successful
      solve, though not yet confirmed as such.

  H1_pureshift:
    category: spectrum_block
    required: unknown
    server_consumed: true
    note: See H1_1D — same rebuild-from-HSQC relationship.

  C13_1D:
    category: spectrum_block
    required: unknown
    server_consumed: true
    note: >
      Used for c13_pks/ppm cross-checks against HSQC and in
      exact_ppm_values_only(). Hard-requirement status not yet confirmed,
      though it's used alongside HSQC in several validation paths.

  NOESY:
    category: spectrum_block
    required: never   # CONFIRMED this pass — see note
    server_consumed: false
    note: >
      NEWLY ADDED this pass after pulling config/globals.py and
      config/excel_headers.py directly. NOESY IS a member of the literal
      NMREXPERIMENTS token list (confirmed, see
      _spectrum_key_classification below) and has a full column schema
      defined in config/excel_headers.py:EXCEL_ORIG_DF_COLUMNS, so it
      classifies and parses into a dataframe like any other spectrum
      block. However, a repo-wide grep of core/ and app/ found ZERO
      references to "NOESY" — it is never read by any solving, assignment,
      or validation logic in nmrsolution.py or html_from_assignments.py.
      It IS referenced client-side (utils/mnova_utils.py — an MNova-side
      converter utility separate from the .qs dialog scripts — and
      templates/mainPage.html), so NOESY data can genuinely be submitted
      and will parse cleanly, it just has no effect on the server solve.
      Classify as a legitimate but functionally inert passthrough
      spectrum type for the common-interface contract.

  # ---------------------------------------------------------------------
  # Passthrough fields (read into memory, never consumed by server logic)
  # confirmed empirically by running real files through the live pipeline
  # ---------------------------------------------------------------------
  nucleus:
    required: everywhere
    server_consumed: false
    type_by_source:
      jason: "list[str]"
      mnova: "malformed unquoted string, e.g. [13C, 1H]"
      bruker: "quoted string, e.g. \"['1H','13C']\""
    note: Type mismatch confirmed on real matched files. Harmless today
      since unconsumed, but should be standardized for maintainability.

  specfrequency:
    required: everywhere
    server_consumed: false
    type_by_source:
      jason: "list[float]"
      mnova: "stringified list"
      bruker: "stringified list"

  temperature:
    required: everywhere
    server_consumed: false
    type_by_source:
      mnova: float
      jason: float
      bruker: string

  solvent:
    required: everywhere
    server_consumed: false
    type_by_source: {all: string}

  experimenttype:
    required: everywhere
    server_consumed: false
    note: >
      Vocabulary differs across sources (e.g. "2D-HSQC-EDITED" vs "HSQC"
      vs "2D-HSQC"). Confirmed harmless since not used for classification
      (see _spectrum_key_classification) — classification uses the
      top-level key name + "type" field instead.

  subtype:
    required: unknown
    server_consumed: false

  pulsesequence:
    required: unknown
    server_consumed: false

  intrument:  # sic - typo preserved from source field name
    required: unknown
    server_consumed: false

  probe:
    required: unknown
    server_consumed: false

  class:
    required: unknown
    server_consumed: false

  origin:
    required: unknown
    server_consumed: false

  spectype:
    required: unknown
    server_consumed: false

  experiment:
    required: unknown
    server_consumed: false

  filename:
    required: unknown
    server_consumed: false

  datafilename:
    required: unknown
    server_consumed: false

  expt_fn:
    required: unknown
    server_consumed: false

  atomNumber:
    required: everywhere
    server_consumed: true
    location: inside atom info entries (allAtomsInfo / carbonAtomsInfo)
    type_by_source:
      jason: int
      mnova: string
      bruker: string
    semantic_clarification: >
      CRITICAL, per Eric direct confirmation this pass: atomNumber is NOT
      the molfile/RDKit atom index (that's the separate "atom_idx" field/
      column). atomNumber is a user-facing DISPLAY LABEL rendered over the
      molecule in the UI. Users are free to set it to arbitrary strings —
      confirmed examples include primed labels like "4'" or "5''", not
      just plain integers. One known cross-tool constraint: MNova does not
      display Greek letters in atomNumber labels when a solution is read
      back into MNova, so Greek-letter labels are effectively unsupported
      round-trip even though nothing server-side appears to reject them.
      This reframes the earlier type-coercion note below: the isnumeric()
      branch in create_network_graph() isn't really "tolerating a type
      mismatch," it's correctly handling the fact that atomNumber is
      fundamentally a free-form label that HAPPENS to often be numeric —
      the int/string split across sources was never a bug to fix, it's
      the expected shape of a label field. Any common-interface schema
      for this field should type it as a string/label, not a number,
      with numeric-string coercion treated as a display convenience, not
      the field's true type. Distinct from atom_idx, which IS the
      structural molfile/RDKit index used for graph construction.
    note: >
      RESOLVED this pass, core/nmrsolution.py create_network_graph()
      L2928-2936: server tolerates both. int/float values are coerced to
      int directly. String values are checked with .isnumeric() — numeric
      strings ("12") are coerced to int, non-numeric strings (including
      primed labels like "4'") are kept as-is (str).
    real_file_confirmation: >
      Eric's primed-label description directly confirmed in a real
      submitted file (Cytochalasin-B-kate_assignments_mresnova.json,
      provided this pass): carbonAtomsInfo and nmrAssignments entries
      both carry "atomNumber": "6'" (with the prime character, string
      type) alongside a separate, purely-numeric "atom_idx": 0 / 1 on
      the same record — real-world proof the two fields are genuinely
      independent, not just theoretically so.

  # ---------------------------------------------------------------------
  # Indexed/dict fields
  # parsed via DataFrame.from_dict(data[k]["data"], orient="index")
  # ---------------------------------------------------------------------
  allAtomsInfo:
    category: indexed_dict
    required: everywhere
    server_consumed: true

  carbonAtomsInfo:
    category: indexed_dict
    required: everywhere
    server_consumed: true
    required_columns_confirmed: >
      CONFIRMED this pass — server minimally needs "atom_idx" and
      "atomNumber" columns (core/expectedmolecule.py L213/222/233 reads
      carbonAtomsInfo["atomNumber"].values as a fallback ATOMNUMBER
      source; core/html_from_assignments.py L1306-1320 reads
      row["atom_idx"] and then OVERWRITES/adds ppm, ppm_calculated,
      iupacLabel, jCouplingVals, jCouplingClass, H1_ppm, visible, x, y
      server-side — so those columns, if submitted, are not trusted
      input, they're recomputed).
    robustness_flag: >
      CONFIRMED this pass: also NOT covered by add_missing_spectra's
      backfill safety net, same as smiles/molfile — see coverage_gap_
      confirmed in _spectrum_key_classification.

  nmrAssignments:
    category: indexed_dict
    required: [mnova, bruker]
    missing_from: [jason]
    server_consumed: true
    required_columns_confirmed: >
      CONFIRMED this pass, core/html_from_assignments.py: f1_ppm,
