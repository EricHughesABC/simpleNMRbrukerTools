    cross_source_confirmed: >
      RESOLVED this pass. BRUKER: confirmed present, core/json_converter.py
      _add_nmr_spectra — but built from a DIFFERENT, WIDER source than
      chosenSpectra: it iterates self.bruker_data.items() (every raw
