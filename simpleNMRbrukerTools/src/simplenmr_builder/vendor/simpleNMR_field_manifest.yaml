  MNOVAcalcMethod:
    category: singleton_scalar
    required: everywhere
    server_consumed: true
    observed_values: ["MNOVA Predict", "NMRSHIFTDB2 Predict", "JEOL Predict", "other/empty?"]
    paired_with: c13predictions
    gates:
      - method: is_prediction()
        true_when: "value in [MNOVA Predict, NMRSHIFTDB2 Predict, JEOL Predict]"
      - method: prediction_from_nmrshiftdb2()
        true_when: "value in [NMRSHIFTDB2 Predict, JEOL Predict]"
      - method: JEOL_prediction_used()
        true_when: "value in [JEOL Predict, MNOVA Predict]"
        caution: >
          CORRECTED this pass, per Eric directly: this is NOT primarily a
          naming bug or an arbitrary "which source do we trust" business
          decision — see note and historical_atom_indexing_note below for
          the corrected explanation. Lower priority now than previously
          framed; treat as understood, with a future-refactor
          recommendation rather than an open bug report.
    note: >
      CORRECTED AGAIN this pass, per Eric directly (previous manifest
      passes had progressively refined this but still framed it as an
      independent "trust vs recompute" business decision, gated by a
      possibly-mistakenly-named method — that framing was itself
      incomplete). Eric's direct explanation: core/expectedmolecule.py's
      expectedMolecule class uses JEOL_predict in exactly two places
      (confirmed by grep — L141 and L186), and BOTH are fundamentally
      about ATOM INDEX ALIGNMENT, not about prediction trust as an
      independent concept:
        - L141: self.molprops_df["atom_idx"] offset, historically
          different per-branch, NOW HARDCODED to +0 in BOTH the
          JEOL_predict and non-JEOL_predict branches (see the "EEH
          2025-sep-06" comment marking the change) — meaning JEOL_predict
          currently has NO EFFECT on this specific computation; the
          branch structure survives in the code but is presently dead
          with respect to its original purpose.
        - L186 (documented in prior passes as the "c13predictions trust
          gate"): "if (mnova_c13predictions is not None) and
          JEOL_predict:" merges mnova_c13predictions directly into
          molprops_df ON g.ATOMIDX. This only works correctly if the
          submitted predictions' atom indices already match molprops_df's
          own RDKit-derived 0-based indexing scheme — which, per Eric,
          historically held for JEOL's and (once added) MNova's own
          submitted predictions, "as is the case for nmrshiftdb" too.
          The apparent "trust vs recompute" behavior documented in prior
          passes is real and accurately described, but it is a
          CONSEQUENCE of atom-index-scheme compatibility, not an
          independently-chosen trust decision — the code merges directly
          when it can safely assume matching indices, and recomputes via
          nmrshiftdb2 (which naturally produces indices matching
          molprops_df's own scheme) otherwise.
      PRACTICAL IMPLICATION: the earlier "ask Eric whether this is a bug"
      framing is resolved — Eric has explained the mechanism directly.
      Eric ALSO flagged this as a genuine future-refactor candidate: he
      suggested replacing JEOL_predict with something conceptually
      cleaner like an "already_predicted" flag (does this submission
      already carry directly-usable, correctly-indexed per-atom
      predictions, so no recompute is needed), kept SEPARATE from
      whatever indexing-alignment concept a NEW future source might need
      — since a hypothetical future source could have already_predicted
      predictions whose indices start at 1 rather than 0, which the
      current single JEOL_predict flag cannot express (it conflates "use
      submitted predictions" with "assume 0-based indices" into one
      boolean). Worth keeping as a concrete design note for whenever this
      class gets refactored for multi-source coherence, not an urgent fix.
    output_side_atom_indexing_confirmed: >
      FULLY RESOLVED this pass, both directions now confirmed with direct
      code evidence. Eric mentioned atom index starting at 1 "only comes
      into play when brought back into MNova and the assign button is
      clicked, but I can't see where that happens" — that's the INBOUND
      half, found in MNOVAscripts/simpleASSIGN_eeh.qs L172-186: "var
      atom_idx = parseInt(atom['id']); ... atom_idx += 1; ...
      assign.setChemShift(atom_idx, 0, c13_ppm);" — applied
      UNCONDITIONALLY to every source (a commented-out earlier version
      immediately above only added 1 when jsondata['dataFrom'] ==
      'nmrshiftdb2'; later replaced with an unconditional +1 for
      everyone). MNova's own NMRAssignments.setChemShift() API expects
      1-based atom indices, so server-returned 0-based results are
      converted right before being handed to MNova's internal assignment
      function.

      The OUTBOUND half — converting MNova's own 1-based internal
      atom.index DOWN to 0-based when building data to submit — is in
      MNOVAscripts/predictCarbon_eeh.qs (uploaded this pass), L78-92: the
      live code builds each c13predictions record as
      "atom_idx": atom_idx-1 (with the comment "zero based index changed
      EEH 2025-sep-06" — the SAME change-tag as the L141
      expectedmolecule.py fix and the simpleASSIGN_eeh.qs +1 conversion,
      confirming all three were part of one coordinated fix on the same
      date). This is the code that produces MNova's own submitted
      c13predictions for the "MNOVA Predict" MNOVAcalcMethod case — i.e.
      directly the data that flows into the JEOL_predict-gated merge
      documented in this entry's main note. A large commented-out older
      implementation immediately above (L52-76) used a more roundabout
      atomNumber-to-index dictionary approach before being simplified to
      the direct atom_idx-1 computation — historical cleanup, not a live
      concern.

      Both directions are PURE MNova-API-boundary conversions: MNova's
      own internal scripting API is 1-based (not something Eric
      controls), the JSON contract and server are consistently 0-based,
      and both .qs scripts convert right at the boundary, on the same
      date, as a coordinated pair. This has NO relationship to
      JEOL_predict/MNOVAcalcMethod beyond happening to share the same
      fix date, and nothing further to investigate here — full round
      trip confirmed with code on both ends.
    is_prediction_note: >
      is_prediction() == False also triggers MNova's sync_pipeline.run()
      round-trip (see is_prediction usage note below) — that gate is
      separate from the c13predictions merge-vs-recompute logic
      documented above.
    architecture_note: >
      Per Eric: the nmrshiftdb2 chemical-shift-prediction calculation is
      written in Java, which is why it lives server-side rather than
      being something each client (MNova/Bruker/JEOL) would need to
      install locally — explains why "NMRSHIFTDB2 Predict" always means
      a server-side recompute rather than ever trusting a client-submitted
      value for that specific method.
    historical_atom_indexing_note: >
      Per Eric, separately: JEOL Predict / MNOVA Predict / NMRSHIFTDB2
      Predict were previously ALSO entangled with whether molecule atom
      indexing started at 0 or 1 in a DIFFERENT piece of code — the
      commented-out "nodes_offset" branching in core/nmrsolution.py
      initiate_molgraph() (L138-149), which used to vary the offset by
      MNOVAcalcMethod value and is now hardcoded to 0 unconditionally
      (same "EEH 2025-sep-06" change window). Eric believes this was
      fixed on both client and server sides and is no longer an issue —
      treat as RESOLVED/historical. This is the SAME underlying 0-vs-1
      historical pattern as L141 above, in a different file.

