  chosenSpectra:
    category: special
    required: [mnova, bruker, jason]  # RESOLVED this pass — all three confirmed
    server_consumed: true
    source_construction: >
      CLIENT-SIDE (MNova), confirmed by reading xy3_dialog2.qs and
      simplePREDICT_eeh.qs directly. Each entry is the string
      "<spec_id> <chosen_experiment_type>", built ONLY for spectra whose
      dialog checkbox is checked (checkboxes1[key].checked == true).
      spectra["chosenSpectra"]["count"]/["data"] on the server side is
      populated directly from this array (simplePREDICT_eeh.qs ~L513-532).
      Checkbox default state is forced to true for every row by a client-
      side loop in xy3_dialog2.qs — this is NOT the "include/exclude"
      control despite visually implying it (see chosenSpectra_ux_note
      below); exclusion is intended to happen via the per-row dropdown's
      "SKIP" option instead, though as of this pass the checkbox is what
      the server-side field actually keys off, not the dropdown value.
    note: >
      FRAGILE server-side parsing (from earlier html_from_assignments.py
      review): reconstructed via string-splitting on whitespace, with
      nucleus/dimension inferred from character length of a token
      (length in [2,3] -> "1D", [7,8,9] -> "2D"). Now that the client-side
      construction is confirmed, the manifest can specify the exact
      string shape this parsing depends on: "<spec_id> <expt_type>",
      where spec_id itself may itself contain spaces (see real example:
      "13C 1D zgpg30 Aug07-2026_Sabinene.11.fid_2"), which is likely why
      length-based inference was used instead of a fixed split index.
    chosenSpectra_ux_note: >
      Client-side dialog (xy3_dialog2.qs) has a per-row CheckBox AND a
      per-row ComboBox with a "SKIP" option. Both can independently signal
      "don't use this spectrum," but only the checkbox actually gates
      chosenSpectra; the dropdown's SKIP value still flows unconditionally
      into exptIdentifiers regardless of checkbox state (see below). A
      developer note was added directly in the dialog telling the user to
      leave checkboxes ticked and use the dropdown to identify/skip
      experiments — current real-world guidance is "checkbox = leave
      alone, dropdown = the actual per-spectrum decision," but the
      server-side field this feeds (chosenSpectra) is keyed off the
      checkbox, not the dropdown. Worth resolving properly (single
      exclusion mechanism, not two) when this dialog gets redesigned.
    cross_source_confirmed: >
      RESOLVED this pass by reading simpleNMRbrukerTools and
      simpleNMRjeolTools3 directly (both cloned from Eric's GitHub).
      Both Bruker and JEOL confirmed to submit chosenSpectra, and both
      converge on the same general shape — a multi-token string ending
      in the experiment type as the final whitespace-delimited token,
      compatible with the server's s.split()[-1]/[-2] parsing — but each
      source builds it with a genuinely different mechanism:
        BRUKER (core/json_converter.py _add_nmr_spectra, confirmed live/
        imported code, NOT the sibling json_converter_2.py or the
        "-DA-..." variant, both confirmed unused/dead via repo-wide
        import grep): entry shape is
        "<nucleus_str> <dimensions>D <pulseprogram> <spectrum_id> <exp_type>"
        — same 5-field pattern as MNova. UI is a single per-experiment
        ChoiceItem dropdown (procno choices + a "SKIP" option appended),
        confirmed in topspin_programs/simpleNMRbruker.py — ONE selection
        mechanism per spectrum, no checkbox/dropdown duplication like
        MNova. Critically: experiments where the user selects "SKIP" are
        filtered OUT of user_selections BEFORE chosenSpectra is built
        ("if selected_choice != 'SKIP': user_selections[expt_id] = ...").
        This means Bruker's chosenSpectra NEVER contains a literal "SKIP"
        token — SKIP'd spectra are simply absent from the list entirely,
        a different mechanism from MNova's "include the SKIP token, let
        the server strip it" pattern, though functionally equivalent for
        the server's downstream set-based HSQC check.

        JEOL (simpleNMRjeolTools.py get_chosenSpectra() — see
        live_file_correction below for an important update on which
        file this actually is): entry shape is
        "<expt_name> <experiment_type>" where expt_name is itself a
        4-token string (nucleus, pulsesequence, expt_fn, id) — so still a
        multi-token, expt-type-last shape overall. UI is also a single
        per-experiment dropdown (SKIP as an explicit, default-selected
        choice, confirmed in chooseSpectra.py). Like Bruker, JEOL also
        filters SKIP-assigned entries out before building chosenSpectra —
        but via a REAL BUG: "for assignment in self.spectra_assignments:
        if assignment['experiment_type'] == 'SKIP':
        self.spectra_assignments.remove(assignment)" mutates the list
        while iterating over it. This is a textbook Python bug — when two
        or more SKIP-assigned entries are adjacent in the list, list
        index shifting after each removal causes the iterator to skip
        over the entry immediately following a removed one, so it never
        gets evaluated for removal. Even worse than first described: a
        standalone regression test (test_skip_filtering.py, built when
        the fix was applied) found the bug also leaks a survivor through
        in the ALL-SKIP case (three consecutive SKIPs still leaves one
        behind), not just adjacent-pair cases. FIXED — see
        live_file_correction below for what was actually patched.
    live_file_correction: >
      IMPORTANT CORRECTION, discovered when Eric provided
      simpleNMRjeolTools_v8.py directly and said "this is the file I was
      using inside JEOL/JASON": the earlier "confirmed live code — this
      file, not the development/ variants" claim above was WRONG for
      JEOL. Eric's v8 file is byte-identical to
      development/simpleNMRjeolTools_v8.py in the repo — i.e. the file
      actually in production use lives in the folder this manifest had
      assumed was lower-priority/non-canonical. Unlike Bruker, where an
      explicit import graph (cli.py/simpleNMRbruker.py both importing
      core.json_converter specifically) gave a real signal for which
      file was live, JEOL has no equivalent entry-point evidence in the
      repo itself — the actual deployed script is whatever path is
      configured in JASON's External Tools plugin, which isn't visible
      from the repo structure at all. The "development/ folder is
      lower-priority" heuristic used throughout this manifest is
      therefore CONFIRMED WRONG at least for JEOL, and should not be
      relied on for JEOL going forward without independent confirmation
      per-file.
      SCOPE OF THE BUG: grepping every simpleNMRjeolTools* copy in the
      repo found the identical buggy pattern present in SEVEN files —
      development/{v4,v5,v6,v7,v8,simpleNMRjeolTools.py}.py AND the
      top-level simpleNMRjeolTools_v5.py (a second, separate top-level
      copy this manifest hadn't previously flagged) — all copy-pasted
      forward with the bug intact since it was introduced around v4
      (v3 and simpleNMRjeolTools_old.py predate the dropdown-based
      filtering feature entirely and don't have this code path at all).
      The top-level simpleNMRjeolTools.py was patched first (before this
      correction came in) on the mistaken assumption it was the live
      file; Eric's actual v8 was then patched separately once the
      correction was clear — both patches are identical in substance.
      The other five known-affected copies (v4, v5, v6, v7, and the
      second top-level v5) are being deleted, not individually patched —
      Eric decided directly to consolidate the repo down to v8 only
      (the fixed version) and remove every other simpleNMRjeolTools*.py
      copy, then push. This resolves the underlying structural risk
      (10 near-duplicate files, no single source of truth) at its root
      rather than patching each stale copy individually. Going forward,
      there should be exactly one file for this manifest to track.

      SUMMARY for the common-interface schema: the literal-"SKIP"-token-
      in-chosenSpectra behavior is MNova-specific (by design, per the
      server's explicit SKIP-stripping code); Bruker and JEOL both
      intend to filter SKIP out client-side before submission — Bruker
      does so correctly, JEOL does so with a bug that can leak SKIP'd
      spectra through. A converter-agnostic interface spec should
      probably document SKIP-handling as "either omit the spectrum
      entirely, or include it with a literal SKIP token — the server
      strips SKIP tokens either way" so implementers aren't tempted to
      write their own filtering logic (and don't repeat JEOL's mistake).

