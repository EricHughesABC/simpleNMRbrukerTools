# pyproject.toml

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simpleNMRbrukerTools"
version = "1.1.0"
description = "Calls simpleNMR from Bruker Topspin"
authors = [{name = "Eric Hughes", email = "erichughesabc@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "simpleNMRbuilder[gui,viewer] @ git+https://github.com/EricHughesABC/simpleNMRbuilder.git",
    "numpy>=1.20.0",
    "pandas>=1.5.0",
    "requests>=2.25.0",
    "rdkit>=2022.9.1",
]
# guidata, PyQt5, and pathlib-mate deliberately removed from the previous
# version of this file:
#   - guidata (built on PyQt5) was removed from this project entirely —
#     PyQt5 alongside PySide6 (which simpleNMRbuilder[viewer] installs
#     for the shared HTML result viewer) caused a confirmed real crash
#     (macOS Objective-C class collisions + a fatal QWidget/QApplication
#     error, 2026-08-27). Do not reintroduce either, even transitively.
#   - pathlib-mate was listed but never actually imported anywhere in
#     this package's source.

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
]

[project.scripts]
setup-topspin = "simpleNMRbrukerTools.cli:setup_topspin"
uninstall-topspin = "simpleNMRbrukerTools.cli:uninstall_topspin"

[project.urls]
Repository = "https://github.com/EricHughesABC/simpleNMRbrukerTools"

# Package discovery for src-layout with simpleNMRbrukerTools package
[tool.setuptools.packages.find]
where = ["src"]
include = ["simpleNMRbrukerTools*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=src",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--verbose"
]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line-length = 88
